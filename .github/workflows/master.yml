name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and Install
        uses: ./.github/actions/setup-node

      - name: Run Lint
        run: npm run lint

  unit-test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and Install
        uses: ./.github/actions/setup-node

      - name: Run Unit Tests with Coverage
        run: npm run test:coverage

  deploy:
    needs: [lint, unit-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js and Install
        uses: ./.github/actions/setup-node

      - name: Build
        run: npm run build

      - name: List dist directory
        run: ls -R dist

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "STARTING GITHUB ACTIONS DEPLOYMENT"
          # We use '.' as the directory because pages_build_output_dir is defined in wrangler.jsonc
          # If that fails, we fallback to explicit dist
          npx wrangler pages deploy --project-name=myfunds --branch=master --commit-dirty=true || npx wrangler pages deploy dist --project-name=myfunds --branch=master --commit-dirty=true
          echo "FINISHED GITHUB ACTIONS DEPLOYMENT"

